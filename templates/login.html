<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Gym Progress Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container" style="max-width: 360px; padding-top: 15vh;">
        <h1 style="text-align: center;">Gym Progress Tracker</h1>
        {% if error %}<div class="warnings" style="text-align: center;">{{ error }}</div>{% endif %}
        <form method="post" action="/login" style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px;">
            <label>Email
                <input type="email" name="email" required autofocus style="width: 100%; margin-top: 4px;">
            </label>
            <label>Password
                <input type="password" name="password" required style="width: 100%; margin-top: 4px;">
            </label>
            <button type="submit" class="primary" style="margin-top: 8px;">Log in</button>
        </form>
    </main>
</body>
</html>
