<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Gym Progress Tracker</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main class="container" style="max-width: 360px; padding-top: 15vh;">
        <h1 style="text-align: center;">Gym Progress Tracker</h1>
        {% if error %}<div class="warnings" style="text-align: center;">{{ error }}</div>{% endif %}
        <form method="post" action="/signup" style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px;">
            <label>Email
                <input type="email" name="email" required autofocus style="width: 100%; margin-top: 4px;">
            </label>
            <label>Password
                <input type="password" name="password" required minlength="8" style="width: 100%; margin-top: 4px;">
            </label>
            <label>Confirm password
                <input type="password" name="confirm_password" required minlength="8" style="width: 100%; margin-top: 4px;">
            </label>
            <button type="submit" class="primary" style="margin-top: 8px;">Create account</button>
        </form>
        <p style="text-align: center; margin-top: 16px; color: var(--text-dim); font-size: 0.9em;">
            Already have an account? <a href="/login" style="color: var(--accent);">Log in</a>
        </p>
    </main>
</body>
</html>
