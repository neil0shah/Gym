<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gym Progress Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="topnav">
        <div class="brand">Gym Progress Tracker</div>
        <a href="/import" class="{% block nav_import %}{% endblock %}">Add / Import</a>
        <a href="/progress" class="{% block nav_progress %}{% endblock %}">Progress</a>
        <a href="/exercises" class="{% block nav_exercises %}{% endblock %}">Manage Exercises</a>
        {% if auth_enabled %}<a href="/logout">Log out</a>{% endif %}
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
